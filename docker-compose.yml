services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: propdf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [propdf_db:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [db]
    volumes: ["./uploads:/app/uploads"]
volumes:
  propdf_db:
